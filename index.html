<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRAJWL ന്റെ തമാശകൾ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2f8fe0;--ray:#5bb0f2;--paper:#fffdf5;--ink:#1d1d1d;--wood:#d99a4e;--wood-d:#8a5a22;--yel:#ffd91a;--red:#d62a2a;--btn:#fff;--btn-ink:#1d1d1d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15508a;--ray:#2273bd;--paper:#2a2a33;--ink:#f6f6f6;--btn:#2a2a33;--btn-ink:#f6f6f6}}
:root[data-theme="dark"]{--bg:#15508a;--ray:#2273bd;--paper:#2a2a33;--ink:#f6f6f6;--btn:#2a2a33;--btn-ink:#f6f6f6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Baloo Chettan 2','Noto Sans Malayalam','Manjari',system-ui,sans-serif;color:var(--ink);background:var(--bg) repeating-conic-gradient(var(--bg) 0 8deg,var(--ray) 8deg 16deg);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.stage{width:min(92vw,430px);perspective:1400px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0}
.book{width:100%;cursor:pointer;user-select:none}
.cover img{width:100%;display:block;border-radius:6px 14px 14px 6px;box-shadow:0 18px 40px rgba(0,0,0,.45),inset 6px 0 8px rgba(0,0,0,.2);transition:transform .25s}
.cover:hover img{transform:rotate(-1deg) scale(1.02)}
.hint{color:#fff;font-weight:800;font-size:1.05rem;text-shadow:0 2px 0 rgba(0,0,0,.35);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.page{background:var(--paper);border-radius:8px 18px 18px 8px;border-left:10px solid #1b6fc0;box-shadow:0 18px 40px rgba(0,0,0,.4);padding:18px 18px 22px;min-height:min(70vh,540px);display:flex;flex-direction:column;align-items:center;text-align:center;transform-origin:left center;animation:flip .55s ease}
@keyframes flip{from{transform:rotateY(-80deg);opacity:.2}to{transform:none;opacity:1}}
.sign{background:var(--wood);border:4px solid var(--wood-d);border-radius:12px;padding:4px 22px;font-weight:800;font-size:1.5rem;color:#fff;text-shadow:2px 2px 0 var(--wood-d);position:relative;margin-top:6px}
.sign:before,.sign:after{content:"";position:absolute;top:-14px;width:4px;height:12px;background:var(--wood-d)}
.sign:before{left:22px}.sign:after{right:22px}
.emoji{font-size:4.2rem;margin:14px 0 4px;animation:wob 1.6s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-8deg) scale(1.08)}}
.joke{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;font-size:1.28rem;line-height:1.55;font-weight:500}
.joke .q{font-weight:800}
.joke .a{display:inline-block;background:var(--yel);color:#1d1d1d;border-radius:12px;padding:6px 14px;font-weight:800;transform:rotate(-1.5deg);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.foot{margin-top:12px;font-size:.9rem;opacity:.7}
.nav{display:flex;gap:10px;align-items:center;width:100%;justify-content:center}
.nav button{font:inherit;font-weight:800;background:var(--btn);color:var(--btn-ink);border:3px solid #1d1d1d;border-radius:30px;padding:6px 18px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.nav button:active{transform:translateY(3px);box-shadow:none}
.nav button:disabled{opacity:.4}
.count{background:var(--red);color:#fff;font-weight:800;border-radius:20px;padding:6px 14px;border:3px solid #1d1d1d}
.big{font-size:1.9rem;font-weight:800;color:#1d1d1d;-webkit-text-stroke:0;background:var(--yel);padding:4px 16px;border-radius:12px;transform:rotate(-2deg)}
</style>
</head>

<div class="stage">
  <div class="book" id="book" role="button" tabindex="0" aria-label="Turn page"></div>
  <div class="nav" id="nav" hidden>
    <button id="prev">◀ മുൻപ്</button>
    <span class="count" id="count"></span>
    <button id="next">അടുത്തത് ▶</button>
  </div>
</div>

const jokes=[
{e:"🐦",q:"ടീച്ചർ: ഒരു മരത്തിൽ 10 കിളി ഇരിക്കുന്നു. ഒന്നിനെ വെടിവെച്ചാൽ എത്ര ബാക്കി?",a:"കുട്ടി: ഒന്നുമില്ല ടീച്ചർ, ബാക്കിയെല്ലാം പറന്നുപോകും!"},
{e:"🤕",q:"രോഗി: ഡോക്ടറേ, എനിക്ക് എല്ലാം മറന്നുപോകുന്നു.\nഡോക്ടർ: എത്ര നാളായി?",a:"രോഗി: എന്ത്?"},
{e:"📝",q:"അച്ഛൻ: പരീക്ഷയിൽ നിനക്ക് ഫസ്റ്റ് റാങ്ക് ആണോ?\nമകൻ: അതേ അച്ഛാ, മാർക്ക് ലിസ്റ്റിൽ ആദ്യം എന്റെ പേരാണ്...",a:"താഴെ നിന്ന് നോക്കിയാൽ!"},
{e:"🏊",q:"ഒരാൾ: നിനക്ക് നീന്താൻ അറിയാമോ?\nകൂട്ടുകാരൻ: അറിയാം!\nഒരാൾ: എവിടെ പഠിച്ചു?",a:"കൂട്ടുകാരൻ: വെള്ളത്തിൽ വീണിട്ട്!"},
{e:"🧊",q:"അപ്പു: നീ എന്തിനാ ഫ്രിഡ്ജിന്റെ മുന്നിൽ ഇങ്ങനെ നോക്കി നിൽക്കുന്നത്?",a:"ഡോർ അടയ്ക്കുമ്പോൾ ഉള്ളിലെ ലൈറ്റ് ഓഫ് ആകുന്നത് കാണാൻ പറ്റുമോ എന്ന് നോക്കുകയാ!"},
{e:"😴",q:"ചോദ്യം: ലോകത്തിലെ ഏറ്റവും വേഗത്തിൽ ഓടുന്ന സാധനം ഏതാണ്?",a:"ഉറക്കം! കണ്ണടച്ച് തുറക്കുമ്പോഴേക്കും നേരം വെളുക്കും!"},
{e:"🍎",q:"ഡോക്ടർ: ദിവസവും ഒരു ആപ്പിൾ കഴിച്ചാൽ ഡോക്ടറെ കാണേണ്ടി വരില്ല.\nരോഗി: അതെങ്ങനെ?",a:"ഡോക്ടർ: ആപ്പിൾ എടുത്ത് ഏറിഞ്ഞാൽ ഡോക്ടർ ഓടിപ്പോകും!"},
{e:"🏫",q:"ടീച്ചർ: നീ എന്താ ലേറ്റ് ആയത്?\nകുട്ടി: റോഡിൽ ബോർഡ് ഉണ്ടായിരുന്നു, 'സ്കൂൾ ആഹെഡ്, സ്ലോ ഡൗൺ'.",a:"അതുകൊണ്ട് സ്ലോ ആയി വന്നു ടീച്ചർ!"},
{e:"😭",q:"മകൻ: അമ്മേ, ഇന്ന് സ്കൂളിൽ ടീച്ചർ എന്നെ ശിക്ഷിച്ചു.\nഅമ്മ: എന്തിന്?\nമകൻ: ഞാൻ ചെയ്യാത്ത ഒരു കാര്യത്തിന്.\nഅമ്മ: അതെന്താ?",a:"മകൻ: ഹോംവർക്ക്!"},
{e:"🐔",q:"ചോദ്യം: കോഴി റോഡ് മുറിച്ചു കടന്നത് എന്തിനാണ്?",a:"അപ്പുറത്തെ കോഴിയുടെ വൈഫൈ പാസ്‌വേഡ് അറിയാമായിരുന്നു!"},
{e:"📞",q:"ഭാര്യ: ചേട്ടാ, ഫോണിൽ ആരാ?\nഭർത്താവ്: റോങ് നമ്പർ ആണ്.\nഭാര്യ: അതിന് ഇത്ര നേരം സംസാരിച്ചോ?",a:"ഭർത്താവ്: അവൻ ഒരുപാട് ക്ഷമ ചോദിച്ചു, ഞാൻ ഒരുപാട് ക്ഷമിച്ചു!"},
{e:"🧠",q:"അധ്യാപകൻ: ന്യൂട്ടൺ ഗുരുത്വാകർഷണം കണ്ടുപിടിച്ചത് എങ്ങനെയാണ്?\nകുട്ടി: ആപ്പിൾ തലയിൽ വീണിട്ട്.\nഅധ്യാപകൻ: അതുകൊണ്ട് എന്ത് മനസ്സിലായി?",a:"കുട്ടി: ആപ്പിൾ മരത്തിനു താഴെ ഇരിക്കരുത് എന്ന്!"}
];
